<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Calcul"><link rel="manifest" href="manifest.webmanifest"><title>Grilles de calcul</title><style>
:root{color-scheme:light dark;--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#64748b;--blue:#2563eb;--carry:#f59e0b}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);touch-action:manipulation}.app{max-width:1100px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom))}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card{background:var(--card);border:1px solid #dbe3ef;border-radius:18px;padding:18px;margin-top:12px}.tabs button,button,select{font:inherit}.tabs button,button{min-height:44px;border:1px solid #cbd5e1;border-radius:11px;background:var(--card);color:var(--text);font-weight:800;padding:9px}.tabs button.active{background:var(--blue);color:#fff}.cfg{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:14px}.cfg label{font-size:13px;font-weight:800}.cfg select{display:block;margin-top:4px;min-height:44px;padding:7px;border:1px solid #94a3b8;border-radius:9px;background:var(--card);color:var(--text)}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.actions #capture{background:#2563eb;color:#fff;border-color:#2563eb}.actions #copyStatus{font-size:13px;font-weight:700;color:#166534;min-height:18px}.sheet{overflow:auto;-webkit-overflow-scrolling:touch;padding:10px 2px}.row{display:flex;justify-content:flex-end;gap:4px;margin:4px 0;min-width:max-content}.op{width:34px;flex:0 0 34px;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:900;color:var(--blue)}.place{width:70px;flex:0 0 70px;display:flex;align-items:center;justify-content:center;gap:3px}.digit{width:50px;height:60px;border:1.5px solid var(--line);border-radius:7px;text-align:center;font-size:24px;font-weight:900;background:var(--card);color:var(--text);-webkit-appearance:none;appearance:none}.small{width:21px;height:29px;border:1.5px dashed var(--carry);border-radius:4px;text-align:center;font-size:16px;font-weight:900;background:#fffbeb;color:#92400e}.addcarry{width:31px;height:35px}.subgrid{display:grid;grid-template-columns:34px repeat(var(--cols),70px);column-gap:4px;justify-content:end;align-items:center;margin:4px 0;min-width:max-content}.subgrid .op{grid-column:1}.subcell{width:70px;height:60px;position:relative;display:flex;align-items:center;justify-content:center}.subcell .digit{display:block}.subcell .small{position:absolute;right:calc(50% + 27px);top:50%;transform:translateY(-50%);z-index:2;font-size:11px;line-height:1;padding:0}.subborrow{height:44px;align-items:start;margin:2px 0 10px}.subborrow .subcell{height:44px;display:flex;align-items:flex-start;justify-content:center;padding-top:4px}.subborrow .small{position:static;transform:none;margin:0;font-size:12px;line-height:1;padding:0}.subrule{border-top:3px solid #334155;margin:8px 0 8px 38px}.submain .place{position:relative}.submain .small{position:absolute;right:calc(50% + 27px);top:50%;transform:translateY(-50%)}.borrow .small{border-color:#ea580c;background:#fff7ed;color:#9a3412;margin-right:0}.empty{visibility:hidden}.rule{border-top:3px solid #334155;margin:8px 0 8px 38px}.division{display:grid;grid-template-columns:minmax(290px,1fr) auto;gap:14px}.divright{border-left:3px solid #334155;padding-left:12px}.quot{border-top:3px solid #334155;margin-top:8px;padding-top:10px}.mini{font-size:11px;color:var(--muted);font-weight:800;margin:5px 0}input:focus,button:focus,select:focus{outline:3px solid #93c5fd;outline-offset:2px}@media(max-width:650px){.subgrid{grid-template-columns:34px repeat(var(--cols),59px)}.subcell{width:59px;height:54px}.subcell .small{right:calc(50% + 24px);font-size:10px}.subborrow .small{font-size:11px}.tabs{grid-template-columns:repeat(2,1fr)}.place{width:59px;flex-basis:59px}.digit{width:44px;height:54px}.division{grid-template-columns:1fr}}@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#172033;--text:#f8fafc;--muted:#a8b4c7;--line:#64748b}.card{border-color:#334155}.small{background:#422006;color:#fde68a}}
</style></head><body><main class="app"><h1>Grilles de calcul</h1><p>Pose l’opération et réalise toi-même le calcul.</p><div class="tabs"><button data-op="add" class="active">＋ Addition</button><button data-op="sub">− Soustraction</button><button data-op="mul">× Multiplication</button><button data-op="div">÷ Division</button></div><section class="card"><div id="cfg" class="cfg"></div><div class="actions"><button id="clear" type="button">Effacer</button><button id="capture" type="button">📋 Copier la grille</button><span id="copyStatus" role="status" aria-live="polite"></span></div><div id="sheet" class="sheet"></div></section></main><script>
(()=>{const cfg=document.querySelector('#cfg'),s=document.querySelector('#sheet');let op='add';const st={terms:2,d:4,d2:2};function sel(id,lab,min,max,val){let h='';for(let i=min;i<=max;i++)h+=`<option value="${i}" ${i===val?'selected':''}>${i}</option>`;return `<label>${lab}<select id="${id}">${h}</select></label>`}const digit=(lab='Chiffre')=>`<input class="digit" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="${lab}">`,small=(lab='Retenue',cl='')=>`<input class="small ${cl}" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="${lab}">`,place=x=>`<div class="place">${x}</div>`,blank=()=>place('');function simple(n,sign=''){return `<div class="row"><span class="op">${sign}</span>${Array.from({length:n},()=>place(digit())).join('')}</div>`}function aligned(total,n,sign=''){return `<div class="row"><span class="op">${sign}</span>${Array.from({length:total-n},blank).join('')}${Array.from({length:n},()=>place(digit())).join('')}</div>`}const rule=()=>'<div class="rule"></div>';function add(){const d=st.d,t=st.terms,total=d+1;let h=`<div class="row"><span class="op"></span>${Array.from({length:total},()=>place(small('Retenue','addcarry'))).join('')}</div>`;for(let i=0;i<t;i++)h+=aligned(total,d,i===t-1?'+':'');return h+rule()+simple(total,'=')}function subMainRow(n){return `<div class="subgrid" style="--cols:${n}"><span class="op"></span>${Array.from({length:n},()=>`<div class="subcell">${small('Retenue')}${digit()}</div>`).join('')}</div>`}function subNumberRow(n,sign=''){return `<div class="subgrid" style="--cols:${n}"><span class="op">${sign}</span>${Array.from({length:n},()=>`<div class="subcell">${digit()}</div>`).join('')}</div>`}function borrow(n){return `<div class="subgrid subborrow borrow" style="--cols:${n}"><span class="op"></span>${Array.from({length:n},(_,i)=>`<div class="subcell">${i<n-1?small('Emprunt'):'<span class="small empty"></span>'}</div>`).join('')}</div>`}function sub(){const n=st.d;let h=subMainRow(n);for(let i=1;i<st.terms;i++){h+=subNumberRow(n,'−');if(i===1)h+=borrow(n)}return h+'<div class="subrule"></div>'+subNumberRow(n,'=')}function carries(n){return `<div class="row"><span class="op"></span>${Array.from({length:n},()=>place(small('Retenue','addcarry'))).join('')}</div>`}function mul(){const a=st.d,b=st.d2,total=a+b;let h=aligned(total,a)+aligned(total,b,'×')+rule();for(let i=0;i<b;i++)h+=carries(total)+simple(total);if(b>1)h+=rule()+simple(total,'=');return h}function divi(){const dividend=st.d,divisor=st.d2,left=dividend+1,q=Math.max(1,dividend-divisor+1);let work='';for(let i=0;i<Math.max(2,dividend);i++)work+=simple(left);return `<div class="division"><div><div class="mini">Dividende</div>${aligned(left,dividend)}<div class="mini">Zone de calcul</div>${work}<div class="mini">Reste</div>${simple(divisor+1)}</div><div class="divright"><div class="mini">Diviseur</div>${simple(divisor)}<div class="quot"><div class="mini">Quotient</div>${simple(q)}</div></div></div>`}function config(){if(op==='add'||op==='sub')cfg.innerHTML=sel('terms','Nombre de termes',2,8,st.terms)+sel('d','Chiffres par terme',1,10,st.d);else if(op==='mul')cfg.innerHTML=sel('d','Chiffres du multiplicande',1,8,st.d)+sel('d2','Chiffres du multiplicateur',1,6,st.d2);else cfg.innerHTML=sel('d','Chiffres du dividende',1,10,st.d)+sel('d2','Chiffres du diviseur',1,6,st.d2);cfg.querySelectorAll('select').forEach(x=>x.addEventListener('change',()=>{st[x.id]=Number(x.value);draw()}))}function bind(){s.querySelectorAll('input').forEach(x=>{x.addEventListener('input',()=>{x.value=x.value.replace(/\D/g,'').slice(0,1);if(x.value)x.blur()})})}async function copyGrid(){const btn=document.querySelector('#capture'),status=document.querySelector('#copyStatus');status.textContent='';if(!navigator.clipboard||typeof ClipboardItem==='undefined'){status.textContent='Copie image non prise en charge sur cette version de Safari.';return}const target=document.querySelector('.card');const clone=target.cloneNode(true);clone.querySelector('.actions')?.remove();clone.querySelectorAll('input').forEach(i=>{const span=document.createElement('div');span.textContent=i.value||'';span.className=i.className;span.style.display='flex';span.style.alignItems='center';span.style.justifyContent='center';i.replaceWith(span)});const cs=getComputedStyle(target),w=Math.ceil(target.scrollWidth),h=Math.ceil(target.scrollHeight);const wrap=document.createElement('div');wrap.setAttribute('xmlns','http://www.w3.org/1999/xhtml');wrap.style.cssText=`width:${w}px;min-height:${h}px;padding:18px;background:${cs.backgroundColor};color:${cs.color};font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;box-sizing:border-box`;const style=document.querySelector('style').cloneNode(true);wrap.appendChild(style);wrap.appendChild(clone);const xml=new XMLSerializer().serializeToString(wrap);const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><foreignObject width="100%" height="100%">${xml}</foreignObject></svg>`;const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'});const url=URL.createObjectURL(blob);try{const img=new Image();await new Promise((ok,ko)=>{img.onload=ok;img.onerror=ko;img.src=url});const scale=Math.min(2,2048/w);const canvas=document.createElement('canvas');canvas.width=Math.round(w*scale);canvas.height=Math.round(h*scale);const ctx=canvas.getContext('2d');ctx.scale(scale,scale);ctx.drawImage(img,0,0);const png=await new Promise((ok,ko)=>canvas.toBlob(b=>b?ok(b):ko(new Error('PNG')),'image/png'));await navigator.clipboard.write([new ClipboardItem({'image/png':png})]);status.textContent='Grille copiée dans le presse-papier.';setTimeout(()=>status.textContent='',2500)}catch(e){console.error(e);status.textContent='Impossible de copier l’image. Vérifie les autorisations Safari.'}finally{URL.revokeObjectURL(url)}}function draw(){config();s.innerHTML=op==='add'?add():op==='sub'?sub():op==='mul'?mul():divi();bind()}document.querySelectorAll('[data-op]').forEach(b=>b.addEventListener('click',()=>{op=b.dataset.op;document.querySelectorAll('[data-op]').forEach(x=>x.classList.toggle('active',x===b));draw()}));document.querySelector('#clear').addEventListener('click',()=>s.querySelectorAll('input').forEach(x=>x.value=''));document.querySelector('#capture').addEventListener('click',copyGrid);draw();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));})();
</script></body></html>

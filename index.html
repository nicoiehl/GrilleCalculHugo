<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Calcul"><link rel="manifest" href="manifest.webmanifest"><title>Grilles de calcul - V10</title><style>
:root{color-scheme:light dark;--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#64748b;--blue:#2563eb;--carry:#f59e0b}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);touch-action:manipulation}.app{max-width:1100px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom))}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card{background:var(--card);border:1px solid #dbe3ef;border-radius:18px;padding:18px;margin-top:12px}.tabs button,button,select{font:inherit}.tabs button,button{min-height:44px;border:1px solid #cbd5e1;border-radius:11px;background:var(--card);color:var(--text);font-weight:800;padding:9px}.tabs button.active{background:var(--blue);color:#fff}.cfg{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:14px}.cfg label{font-size:17px;font-weight:800}.cfg select{display:block;margin-top:5px;min-width:90px;height:46px;padding:6px 12px;font-size:18px;font-weight:600;border:1px solid #94a3b8;border-radius:9px;background:var(--card);color:var(--text)}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top-actions #clear{min-width:105px;height:46px;padding:6px 16px;font-size:18px;font-weight:700;border-radius:9px}.capture-bottom{display:flex;gap:10px;align-items:center;justify-content:flex-start;flex-wrap:wrap;margin-top:14px}.capture-bottom #capture{background:#2563eb;color:#fff;border-color:#2563eb}.capture-bottom #copyStatus{font-size:13px;font-weight:700;color:#166534;min-height:18px}.sheet{overflow:auto;-webkit-overflow-scrolling:touch;padding:10px 2px}.row{display:flex;justify-content:flex-end;gap:4px;margin:4px 0;min-width:max-content}.op{width:34px;flex:0 0 34px;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:900;color:var(--blue)}.place{width:70px;flex:0 0 70px;display:flex;align-items:center;justify-content:center;gap:3px}.pv-green{background:#fff!important;border-color:#16a34a!important;border-width:2.5px!important}.pv-blue{background:#fff!important;border-color:#2563eb!important;border-width:2.5px!important}.pv-red{background:#fff!important;border-color:#dc2626!important;border-width:2.5px!important}.digit{width:50px;height:60px;border:1.5px solid var(--line);border-radius:7px;text-align:center;font-size:24px;font-weight:900;background:var(--card);color:var(--text);-webkit-appearance:none;appearance:none}.small{width:21px;height:29px;border:1.5px dashed var(--carry);border-radius:4px;text-align:center;font-size:16px;font-weight:900;background:#fffbeb;color:#92400e}.addcarry{width:31px;height:35px}.mul-layout{position:relative;display:inline-block;min-width:max-content}.mulcarryzone{position:absolute;left:calc(100% + 40px);top:-145px;margin:0;transform:none;display:block}.muladdcarry{display:flex;justify-content:flex-end;margin:4px 0 8px}.muladdcarry .row{margin:0}.mulcarrymatrix{display:grid;gap:5px;justify-content:start}.mulcarrymatrix .small{position:static;width:31px;height:35px;font-size:16px}.mulproduct{display:flex;justify-content:flex-end;align-items:center;min-width:max-content}.mulproduct .row{margin:4px 0}.subgrid{display:grid;grid-template-columns:34px repeat(var(--cols),76px);column-gap:6px;justify-content:end;align-items:center;margin:4px 0;min-width:max-content}.subgrid .op{grid-column:1}.subcell{width:76px;height:60px;position:relative;display:flex;align-items:center;justify-content:center}.subcell .digit{display:block}.subcell .small{position:absolute;right:calc(50% + 30px);top:50%;transform:translateY(-50%);z-index:2;font-size:11px;line-height:1;padding:0}.subborrow{height:44px;align-items:start;margin:2px 0 10px}.subborrow .subcell{height:44px;display:flex;align-items:flex-start;justify-content:center;padding-top:4px}.subborrow .small{position:static;transform:none;margin:0;font-size:12px;line-height:1;padding:0}.subrule{border-top:3px solid #334155;margin:8px 0 8px 38px}.submain .place{position:relative}.submain .small{position:absolute;right:calc(50% + 30px);top:50%;transform:translateY(-50%)}.borrow .small{border-color:#ea580c;background:#fff7ed;color:#9a3412;margin-right:0}.empty{visibility:hidden}.rule{border-top:3px solid #334155;margin:8px 0 8px 38px}.division{display:grid;grid-template-columns:minmax(290px,1fr) auto;gap:14px}.divright{border-left:3px solid #334155;padding-left:12px}.quot{border-top:3px solid #334155;margin-top:8px;padding-top:10px}.mini{font-size:11px;color:var(--muted);font-weight:800;margin:5px 0}input:focus,button:focus,select:focus{outline:3px solid #93c5fd;outline-offset:2px}.capture-overlay{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.76)}.capture-panel{width:min(720px,100%);max-height:92vh;overflow:auto;padding:20px;border-radius:18px;background:var(--card);color:var(--text);text-align:center}.capture-preview{display:block;width:100%;height:auto;border:1px solid #cbd5e1;border-radius:10px;background:#fff;-webkit-touch-callout:default}.capture-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}.capture-actions button,.capture-actions a{min-height:46px;padding:11px 16px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;font-weight:800;text-decoration:none;background:var(--card);color:var(--text)}.capture-actions .share-image{background:#2563eb;border-color:#2563eb;color:#fff}.capture-message{min-height:20px;margin-top:10px;font-size:14px;font-weight:700;color:#166534}@media(pointer:coarse){.cfg select{min-width:95px;height:48px;font-size:19px}.top-actions #clear{min-width:110px;height:48px;font-size:19px}}@media(max-width:650px){.subgrid{grid-template-columns:34px repeat(var(--cols),59px)}.subcell{width:59px;height:54px}.subcell .small{right:calc(50% + 24px);font-size:10px}.subborrow .small{font-size:11px}.tabs{grid-template-columns:repeat(2,1fr)}.place{width:59px;flex-basis:59px}.digit{width:44px;height:54px}.division{grid-template-columns:1fr}}@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#172033;--text:#f8fafc;--muted:#a8b4c7;--line:#64748b}.card{border-color:#334155}.small{background:#422006;color:#fde68a}}
</style></head><body><main class="app"><h1>Grilles de calcul</h1><p>Pose l’opération et réalise toi-même le calcul.</p><div class="tabs"><button data-op="add" class="active">＋ Addition</button><button data-op="sub">− Soustraction</button><button data-op="mul">× Multiplication</button><button data-op="div">÷ Division</button></div><section class="card"><div id="cfg" class="cfg"></div><div class="actions top-actions"><button id="clear" type="button">Effacer</button></div><div id="sheet" class="sheet"></div><div class="capture-bottom"><button id="capture" type="button">📋 Copier la grille</button><span id="copyStatus" role="status" aria-live="polite"></span></div></section></main><script>
(()=>{const cfg=document.querySelector('#cfg'),s=document.querySelector('#sheet');let op='add';const st={terms:2,d:4,d2:2};function sel(id,lab,min,max,val){let h='';for(let i=min;i<=max;i++)h+=`<option value="${i}" ${i===val?'selected':''}>${i}</option>`;return `<label>${lab}<select id="${id}">${h}</select></label>`}const digit=(lab='Chiffre')=>`<input class="digit" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="${lab}">`,small=(lab='Retenue',cl='')=>`<input class="small ${cl}" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="${lab}">`,place=x=>`<div class="place">${x}</div>`,blank=()=>place('');function simple(n,sign=''){return `<div class="row"><span class="op">${sign}</span>${Array.from({length:n},()=>place(digit())).join('')}</div>`}function aligned(total,n,sign=''){return `<div class="row"><span class="op">${sign}</span>${Array.from({length:total-n},blank).join('')}${Array.from({length:n},()=>place(digit())).join('')}</div>`}const rule=()=>'<div class="rule"></div>';function add(){const d=st.d,t=st.terms,total=d+1;let h=`<div class="row"><span class="op"></span>${Array.from({length:total},()=>place(small('Retenue','addcarry'))).join('')}</div>`;for(let i=0;i<t;i++)h+=aligned(total,d,i===t-1?'+':'');return h+rule()+simple(total,'=')}function subMainRow(n){return `<div class="subgrid" style="--cols:${n}"><span class="op"></span>${Array.from({length:n},()=>`<div class="subcell">${small('Retenue')}${digit()}</div>`).join('')}</div>`}function subNumberRow(n,sign=''){return `<div class="subgrid" style="--cols:${n}"><span class="op">${sign}</span>${Array.from({length:n},()=>`<div class="subcell">${digit()}</div>`).join('')}</div>`}function borrow(n){return `<div class="subgrid subborrow borrow" style="--cols:${n}"><span class="op"></span>${Array.from({length:n},(_,i)=>`<div class="subcell">${i<n-1?small('Emprunt'):'<span class="small empty"></span>'}</div>`).join('')}</div>`}function sub(){const n=st.d;let h=subMainRow(n);for(let i=1;i<st.terms;i++){h+=subNumberRow(n,'−');if(i===1)h+=borrow(n)}return h+'<div class="subrule"></div>'+subNumberRow(n,'=')}function carries(n){return `<div class="row"><span class="op"></span>${Array.from({length:n},()=>place(small('Retenue','addcarry'))).join('')}</div>`}function mulCarries(rows,cols){return `<div class="mulcarryzone"><div class="mulcarrymatrix" style="grid-template-columns:repeat(${cols},31px)">${Array.from({length:rows*cols},(_,i)=>`<input class="small addcarry" inputmode="numeric" maxlength="1" aria-label="Retenue de produit ${Math.floor(i/cols)+1}, colonne ${i%cols+1}">`).join('')}</div></div>`}function mul(){const a=st.d,b=st.d2,total=a+b;let products=`<div class="muladdcarry">${carries(total)}</div>`;for(let i=0;i<b;i++)products+=`<div class="mulproduct">${simple(total,'+')}</div>`;if(b>1)products+=rule()+simple(total,'=');return aligned(total,a)+aligned(total,b,'×')+rule()+`<div class="mul-layout">${products}${mulCarries(a,b)}</div>`}function divi(){const dividend=st.d,divisor=st.d2,left=dividend+1,q=Math.max(1,dividend-divisor+1);let work='';for(let i=0;i<Math.max(2,dividend);i++)work+=simple(left);return `<div class="division"><div><div class="mini">Dividende</div>${aligned(left,dividend)}<div class="mini">Zone de calcul</div>${work}<div class="mini">Reste</div>${simple(divisor+1)}</div><div class="divright"><div class="mini">Diviseur</div>${simple(divisor)}<div class="quot"><div class="mini">Quotient</div>${simple(q)}</div></div></div>`}function config(){if(op==='add'||op==='sub')cfg.innerHTML=sel('terms','Nombre de termes',2,8,st.terms)+sel('d','Chiffres par terme',1,10,st.d);else if(op==='mul')cfg.innerHTML=sel('d','Chiffres du multiplicande',1,8,st.d)+sel('d2','Chiffres du multiplicateur',1,6,st.d2);else cfg.innerHTML=sel('d','Chiffres du dividende',1,10,st.d)+sel('d2','Chiffres du diviseur',1,6,st.d2);cfg.querySelectorAll('select').forEach(x=>x.addEventListener('change',()=>{st[x.id]=Number(x.value);draw()}))}function bind(){s.querySelectorAll('input').forEach(x=>{x.addEventListener('input',()=>{x.value=x.value.replace(/\D/g,'').slice(0,1);if(x.value)x.blur()})})}async function makeGridPNG(){const target=document.querySelector('#sheet');if(!target)throw new Error('Grille introuvable');const tr=target.getBoundingClientRect(),pad=24,scale=Math.min(2,2048/(tr.width+pad*2),4096/(tr.height+pad*2));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.ceil((tr.width+pad*2)*scale));canvas.height=Math.max(1,Math.ceil((tr.height+pad*2)*scale));const ctx=canvas.getContext('2d');if(!ctx)throw new Error('Canvas indisponible');ctx.scale(scale,scale);ctx.fillStyle='#ffffff';ctx.fillRect(0,0,tr.width+pad*2,tr.height+pad*2);const els=[target,...target.querySelectorAll('.place,.subcell,.rule,.op,input,.empty')];for(const el of els){if(el===target)continue;const r=el.getBoundingClientRect();if(!r.width&&!r.height)continue;const x=r.left-tr.left+pad,y=r.top-tr.top+pad,cs=getComputedStyle(el);if(el.classList.contains('rule')){ctx.strokeStyle='#000000';ctx.lineWidth=Math.max(1,parseFloat(cs.height)||2);ctx.beginPath();ctx.moveTo(x,y+r.height/2);ctx.lineTo(x+r.width,y+r.height/2);ctx.stroke();continue}if(el.tagName==='INPUT'||el.classList.contains('empty')){const bw=parseFloat(cs.borderTopWidth)||1;ctx.strokeStyle='#000000';ctx.lineWidth=bw;ctx.strokeRect(x+bw/2,y+bw/2,Math.max(0,r.width-bw),Math.max(0,r.height-bw));if(el.tagName==='INPUT'&&el.value){const fs=parseFloat(cs.fontSize)||24;ctx.fillStyle='#000000';ctx.font=`${cs.fontWeight||'400'} ${fs}px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(el.value,x+r.width/2,y+r.height/2+1)}continue}if(el.classList.contains('op')){const txt=(el.textContent||'').trim();if(txt){const fs=parseFloat(cs.fontSize)||24;ctx.fillStyle='#000000';ctx.font=`${cs.fontWeight||'700'} ${fs}px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,x+r.width/2,y+r.height/2)}}}return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('PNG indisponible')),'image/png'))}function showCapture(blob){document.querySelector('.capture-overlay')?.remove();const url=URL.createObjectURL(blob),file=new File([blob],`grille-${op}.png`,{type:'image/png'}),overlay=document.createElement('div');overlay.className='capture-overlay';overlay.innerHTML=`<div class="capture-panel" role="dialog" aria-modal="true"><h2>Capture de la grille</h2><p>L’image est prête. Utilise <strong>Partager / enregistrer</strong> ou maintiens le doigt sur l’image.</p><img class="capture-preview" alt="Capture de la grille"><div class="capture-actions"><button type="button" class="share-image">Partager / enregistrer</button><a class="download-image" download="grille-${op}.png">Télécharger</a><button type="button" class="close-capture">Fermer</button></div><div class="capture-message" role="status" aria-live="polite"></div></div>`;const cleanup=()=>{URL.revokeObjectURL(url);overlay.remove()};overlay.querySelector('.capture-preview').src=url;overlay.querySelector('.download-image').href=url;overlay.querySelector('.close-capture').addEventListener('click',cleanup);overlay.querySelector('.share-image').addEventListener('click',async()=>{const msg=overlay.querySelector('.capture-message');if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){try{await navigator.share({files:[file],title:'Grille de calcul'})}catch(e){if(e.name!=='AbortError')msg.textContent='Partage indisponible. Maintiens le doigt sur l’image.'}}else msg.textContent='Partage indisponible. Maintiens le doigt sur l’image.'});document.body.appendChild(overlay)}async function copyGrid(){const status=document.querySelector('#copyStatus');status.textContent='Création de l’image…';try{const blob=await makeGridPNG();status.textContent='';showCapture(blob)}catch(e){console.error(e);status.textContent='Impossible de créer l’image de la grille.'}}function applyPlaceColors(){const colors=['pv-green','pv-blue','pv-red'];const colorDigits=els=>[...els].reverse().forEach((el,i)=>el.classList.add(colors[i%3]));document.querySelectorAll('#sheet .row,#sheet .subgrid').forEach(row=>colorDigits(row.querySelectorAll('.digit')));document.querySelectorAll('#sheet .small').forEach(el=>el.classList.remove('pv-green','pv-blue','pv-red'))}function draw(){config();s.innerHTML=op==='add'?add():op==='sub'?sub():op==='mul'?mul():divi();applyPlaceColors();bind()}document.querySelectorAll('[data-op]').forEach(b=>b.addEventListener('click',()=>{op=b.dataset.op;document.querySelectorAll('[data-op]').forEach(x=>x.classList.toggle('active',x===b));draw()}));document.querySelector('#clear').addEventListener('click',()=>s.querySelectorAll('input').forEach(x=>x.value=''));document.querySelector('#capture').addEventListener('click',copyGrid);draw();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));})();
</script></body></html>
